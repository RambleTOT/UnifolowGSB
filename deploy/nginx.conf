# Вход снаружи: HTTPS на 443, с 80 — перенаправление. Приложение слушает
# только внутреннюю сеть Docker и наружу напрямую не смотрит.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Загрузка видео: предел как в приложении, тело не буферизуется на диск.
    client_max_body_size 512m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://uniflow:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Живые данные идут по WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Видео (MJPEG) — бесконечный ответ: без этого nginx копил бы его в буфере.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
